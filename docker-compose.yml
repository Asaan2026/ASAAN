name: asaan_online_store

services:
  db:
    image: mysql:8.4
    container_name: asaan_online_store_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-asaan_store}
      MYSQL_USER: ${DB_USERNAME:-asaan_store}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - asaan_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: asaan_online_store_app:latest
    container_name: asaan_online_store_app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public
      # Server secrets kept outside the code repository (git-ignored). The
      # Firebase service-account key lives here so push can sign its requests.
      # Read-only; if empty, the server simply skips push and nothing breaks.
      - ./secrets:/var/www/html/secrets:ro

volumes:
  asaan_db_data: